<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Spelling Ninja</title>
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥷</text></svg>">
  
  <!-- Canvas Confetti Library for the Win Celebration -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <style>
    body { font-family: 'Segoe UI', sans-serif; text-align: center; padding: 10px; background-color: #2c3e50; color: #333; margin: 0; }
    .card { background: white; width: 100%; max-width: 500px; margin: 0 auto; padding: 20px; border-radius: 12px; box-shadow: 0 8px 25px rgba(0,0,0,0.5); border-top: 5px solid #e74c3c; box-sizing: border-box; }
    
    h1 { color: #2c3e50; margin-top: 0; margin-bottom: 10px; }
    
    .list-container { text-align: left; max-height: 300px; overflow-y: auto; border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px 15px; margin: 10px 0; background: #fafafa; }
    .checkbox-item { margin: 8px 0; font-size: 18px; display: flex; align-items: center; cursor: pointer; }
    .checkbox-item input { width: 22px; height: 22px; margin-right: 12px; }
    
    button { padding: 12px 24px; font-size: 18px; font-weight: bold; color: white; background-color: #34495e; border: none; border-radius: 8px; cursor: pointer; margin: 5px; transition: 0.2s; }
    button:hover { background-color: #2c3e50; }
    button:disabled { background-color: #bdc3c7; cursor: not-allowed; }
    
    #gameArea { display: none; }
    
    .btn-submit { background-color: #e74c3c; width: 100%; margin: 10px 0; font-size: 22px; padding: 12px; text-transform: uppercase; letter-spacing: 1px; display: block; box-sizing: border-box; }
    .btn-submit:hover { background-color: #c0392b; }
    .btn-secondary { background-color: #7f8c8d; }
    .btn-row { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; margin-top: 5px; }
    .btn-row button { margin: 2px 0; flex: 1; min-width: 80px; font-size: 14px; padding: 10px 5px; }
    
    #status { margin-top: 5px; font-size: 16px; font-weight: bold; color: #2980b9; min-height: 22px; }
    
    #liveTranscript { 
      width: 100%; 
      box-sizing: border-box;
      font-size: 24px; 
      color: #e67e22; 
      margin: 10px 0; 
      padding: 12px; 
      border: 2px dashed #bdc3c7; 
      border-radius: 8px; 
      background: #ecf0f1; 
      font-weight: bold;
      text-align: center;
      text-transform: uppercase;
      transition: 0.2s;
    }
    #liveTranscript:focus { outline: none; border-color: #3498db; background: #fff; }
    #liveTranscript::placeholder { font-size: 15px; font-weight: normal; color: #95a5a6; text-transform: none; }
    
    #hintDisplay { font-size: 26px; color: #27ae60; font-weight: bold; letter-spacing: 6px; margin: 10px 0; display: none; }
    
    #scoreStats { font-size: 15px; font-weight: bold; color: #34495e; margin-bottom: 10px; background: #ecf0f1; padding: 6px; border-radius: 8px; border: 1px solid #bdc3c7;}
    #scoreStats span { color: #e74c3c; font-size: 16px; }
    #comboDisplay { color: #e67e22; margin-left: 10px; display: none; }
    
    #trackContainer { width: 100%; height: 10px; background: #bdc3c7; border-radius: 6px; position: relative; margin: 25px 0 15px 0; }
    #trackFill { position: absolute; left: 0; top: 0; height: 100%; width: 0%; background: #e74c3c; border-radius: 6px; transition: width 0.4s ease-out; }
    #ninjaSprite { position: absolute; left: 0%; top: -26px; transition: left 0.4s ease-out; z-index: 10; display: flex; flex-direction: column; align-items: center; }
    .ninja-icon { font-size: 26px; line-height: 1; }
    #ninjaScoreBadge { font-size: 12px; font-weight: bold; background: white; color: #e74c3c; border-radius: 50%; width: 18px; height: 18px; line-height: 18px; text-align: center; border: 2px solid #e74c3c; margin-top: 2px; }
    #dojoSprite { position: absolute; right: -5px; top: -16px; font-size: 26px; }

    /* Victory Screen Styles */
    #victoryScreen { display: none; margin-top: 20px; animation: fadeIn 1s; }
    .struggle-board { background: #fdfbf7; border: 2px solid #e2e8f0; border-radius: 8px; padding: 15px; margin-top: 15px; text-align: left; }
    .struggle-item { font-size: 18px; margin: 8px 0; border-bottom: 1px dashed #bdc3c7; padding-bottom: 5px; display: flex; justify-content: space-between; }
    .miss-count { color: #e74c3c; font-weight: bold; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    @media (max-width: 600px) {
      body { background-color: white; padding: 0; }
      .card { border-radius: 0; box-shadow: none; border-top-width: 5px; padding: 10px; min-height: 100vh; display: block; }
      
      h1 { font-size: 22px; margin-bottom: 5px; }
      #scoreStats { padding: 4px; margin-bottom: 8px; font-size: 13px; }
      #trackContainer { margin: 22px 0 8px 0; height: 8px; }
      .ninja-icon { font-size: 22px; }
      #dojoSprite { font-size: 22px; top: -14px; }
      #ninjaSprite { top: -22px; }
      #status { font-size: 14px; margin-top: 2px; min-height: 18px; }
      #liveTranscript { padding: 10px; font-size: 20px; margin: 8px 0; }
      #liveTranscript::placeholder { font-size: 13px; }
      .btn-submit { font-size: 18px; padding: 12px; margin: 8px 0; }
      .btn-row button { padding: 8px 2px; font-size: 13px; }
    }
  </style>
</head>
<body>

  <div class="card" id="appCard">
    <h1>🥷 Spelling Ninja</h1>
    
    <div id="selectionArea">
      <div id="listCheckboxes" class="list-container">Loading word scrolls...</div>
      <button id="startBtn" onclick="startPractice()" disabled>Enter the Dojo</button>
    </div>

    <div id="gameArea">
      <div id="scoreStats">
        Points Needed: <span id="pointsRemaining">0</span> 
        <small style="color: #7f8c8d; font-weight: normal; margin-left: 8px;">(Total: <span id="pointsTotal">0</span>)</small>
        <span id="comboDisplay">🔥 Combo: <span id="comboCount">0</span></span>
      </div>

      <div id="trackContainer">
        <div id="trackFill"></div>
        <div id="ninjaSprite">
          <div class="ninja-icon">🥷</div>
          <div id="ninjaScoreBadge">0</div>
        </div>
        <div id="dojoSprite">🏯</div>
      </div>

      <div id="status">Sensei says listen...</div>
      
      <!-- Interactive Elements Container (Hidden on win) -->
      <div id="interactiveControls">
        <input type="text" id="liveTranscript" placeholder="Type letters..." autocomplete="new-password" autocorrect="off" autocapitalize="none" spellcheck="false" data-lpignore="true" onkeypress="if(event.key === 'Enter') checkAnswer()" oninput="syncManualTyping()">
        
        <div id="hintDisplay"></div>
        
        <button onclick="checkAnswer()" class="btn-submit" id="submitBtn">Strike!</button>
        
        <div class="btn-row">
          <button id="micToggleBtn" onclick="toggleMic()" class="btn-secondary" style="background-color: #c0392b;">🔇 Mic OFF</button>
          <button onclick="repeatWord()" class="btn-secondary">🔊 Hear</button>
          <button onclick="useInSentence()" class="btn-secondary" style="background-color: #f39c12;">📖 Sentence</button>
          <button onclick="clearCurrentText()" class="btn-secondary" style="background-color: #95a5a6;">✖ Clear</button>
        </div>
        <div class="btn-row">
          <button id="hintBtn" onclick="showHint()" class="btn-secondary" style="background-color: #8e44ad; display: none;">💡 Hint</button>
          <button id="tryAgainBtn" onclick="tryAgainManual()" class="btn-secondary" style="background-color: #3498db; display: none;">🔄 Try Again</button>
        </div>
      </div>
      
      <!-- Persistent Victory Screen -->
      <div id="victoryScreen">
        <h2 style="color: #27ae60; margin: 10px 0;">🎉 Dojo Master! 🎉</h2>
        <p style="font-size: 16px; margin: 0; color: #7f8c8d;">You are a true Spelling Ninja.</p>
        
        <div class="struggle-board" id="struggleBoard">
          <h3 style="margin-top: 0; color: #2c3e50; text-align: center;">📜 Ninja Practice Scroll</h3>
          <div id="struggleList"></div>
        </div>
        
        <button class="btn-submit" onclick="location.reload()" style="background-color: #3498db; margin-top: 25px;">Return to Menu</button>
      </div>

    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbw-2IckMLtFYfVC7cGHZAei98DESEcJLXVt5RquD26oJRyYcsnpFaEbFeWZBPLQGBH5dw/exec"; 
    
    let allLists = {};
    let activeWords = [];
    let remainingDeck = [];
    let currentWord = "";
    
    let recognition;
    let isListening = false;
    let micEnabled = false;
    
    let baselineText = "";
    
    let retryTimer;
    let score = 0;
    let maxScore = 1;
    let currentWordMistakes = 0;
    let wordPenaltyApplied = false;
    let hintPenaltyApplied = false;
    
    let combo = 0;
    let wordMistakeTracker = {}; // Tracks overall misspellings per word for the final report

    fetch(API_URL)
      .then(response => response.json())
      .then(data => {
        allLists = data;
        renderListOptions();
      })
      .catch(error => {
        console.error("Error fetching data:", error);
        document.getElementById('listCheckboxes').innerText = "Failed to load ninja scrolls. Check your API URL.";
      });

    function renderListOptions() {
      const container = document.getElementById('listCheckboxes');
      container.innerHTML = "";
      
      const titles = Object.keys(allLists).reverse();
      
      if (titles.length === 0) {
        container.innerText = "No word lists found.";
        return;
      }

      titles.forEach((title, index) => {
        const div = document.createElement('div');
        div.className = 'checkbox-item';
        div.innerHTML = `<input type="checkbox" id="list_${index}" value="${title}" onchange="checkSelection()"><label for="list_${index}">${title}</label>`;
        container.appendChild(div);
      });
      document.getElementById('startBtn').disabled = false;
    }

    function checkSelection() {
      const checked = document.querySelectorAll('#listCheckboxes input[type="checkbox"]:checked');
      document.getElementById('startBtn').disabled = checked.length === 0;
    }
    
    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
    }

    function startPractice() {
      const checkedBoxes = document.querySelectorAll('#listCheckboxes input[type="checkbox"]:checked');
      activeWords = [];
      checkedBoxes.forEach(cb => {
        if (allLists[cb.value]) activeWords = activeWords.concat(allLists[cb.value]);
      });

      if (activeWords.length === 0) return alert("Select at least one training scroll.");

      remainingDeck = []; 
      score = 0;
      combo = 0;
      wordMistakeTracker = {}; // Reset tracking
      maxScore = activeWords.length * 2;
      document.getElementById('pointsTotal').innerText = maxScore;
      updateNinjaTrack();

      document.getElementById('selectionArea').style.display = 'none';
      document.getElementById('gameArea').style.display = 'block';
      nextWord();
    }
    
    function updateNinjaTrack() {
      let progress = (score / maxScore) * 90;
      document.getElementById('ninjaSprite').style.left = progress + "%";
      document.getElementById('trackFill').style.width = progress + "%";
      
      document.getElementById('ninjaScoreBadge').innerText = score;
      document.getElementById('pointsRemaining').innerText = Math.max(0, maxScore - score);
    }
    
    function toggleMic() {
      micEnabled = !micEnabled;
      const btn = document.getElementById('micToggleBtn');
      const inputEl = document.getElementById('liveTranscript');
      
      if (micEnabled) {
        btn.innerHTML = "🎤 Mic ON";
        btn.style.backgroundColor = "#27ae60";
        inputEl.placeholder = "Say or type letters...";
        listenForSpelling();
      } else {
        btn.innerHTML = "🔇 Mic OFF";
        btn.style.backgroundColor = "#c0392b";
        inputEl.placeholder = "Type letters...";
        isListening = false;
        if (recognition) recognition.stop();
        document.getElementById('status').innerText = "⌨️ Keyboard Mode";
        inputEl.focus();
      }
    }

    function nextWord() {
      currentWordMistakes = 0;
      wordPenaltyApplied = false;
      hintPenaltyApplied = false;
      document.getElementById('hintBtn').style.display = "none";
      document.getElementById('tryAgainBtn').style.display = "none";
      document.getElementById('hintDisplay').style.display = "none";
      document.getElementById('submitBtn').style.display = "block"; 

      if (remainingDeck.length === 0) {
        remainingDeck = [...activeWords];
        shuffleArray(remainingDeck);
        
        if (remainingDeck.length > 1 && remainingDeck[0] === currentWord) {
          let temp = remainingDeck[0];
          remainingDeck[0] = remainingDeck[1];
          remainingDeck[1] = temp;
        }
      }

      currentWord = remainingDeck.shift();
      speakAndListen();
    }

    function repeatWord() {
      speakAndListen();
    }

    function showHint() {
      if (!hintPenaltyApplied) {
        score = Math.max(0, score - 1);
        hintPenaltyApplied = true;
        updateNinjaTrack();
      }
      document.getElementById('hintDisplay').innerText = currentWord.toUpperCase();
      document.getElementById('hintDisplay').style.display = "block";
      document.getElementById('submitBtn').style.display = "none"; 
    }

    function tryAgainManual() {
      document.getElementById('hintDisplay').style.display = "none";
      document.getElementById('submitBtn').style.display = "block"; 
      speakAndListen();
    }
    
    function syncManualTyping() {
      let el = document.getElementById('liveTranscript');
      let rawText = el.value.replace(/\s+/g, '');
      let spacedText = rawText.split('').join(' ').toUpperCase();
      if (el.value !== spacedText) {
        el.value = spacedText;
      }
      baselineText = el.value;
    }
    
    function clearCurrentText() {
      document.getElementById('liveTranscript').value = "";
      baselineText = "";
      document.getElementById('liveTranscript').focus();
    }

    function useInSentence() {
      isListening = false;
      if (recognition) recognition.stop();
      clearTimeout(retryTimer);
      document.getElementById('hintDisplay').style.display = "none";
      document.getElementById('status').innerText = "Sensei is consulting the AI scrolls...";
      window.speechSynthesis.cancel();

      fetch(API_URL + "?word=" + encodeURIComponent(currentWord))
        .then(response => response.text())
        .then(sentence => {
          document.getElementById('status').innerText = "Sensei says listen...";
          let sentenceText = `${currentWord}. ${sentence} ${currentWord}.`;
          const utterance = new SpeechSynthesisUtterance(sentenceText);
          utterance.onend = () => {
             if (micEnabled) setTimeout(listenForSpelling, 500);
             document.getElementById('liveTranscript').focus();
          };
          window.speechSynthesis.speak(utterance);
        })
        .catch(error => {
          document.getElementById('status').innerText = "Sensei says listen...";
          const utterance = new SpeechSynthesisUtterance(`Spell ${currentWord}.`);
          utterance.onend = () => {
             if (micEnabled) setTimeout(listenForSpelling, 500);
             document.getElementById('liveTranscript').focus();
          };
          window.speechSynthesis.speak(utterance);
        });
    }

    function speakAndListen() {
      isListening = false;
      if (recognition) recognition.stop();
      clearTimeout(retryTimer);
      
      document.getElementById('hintDisplay').style.display = "none"; 
      document.getElementById('liveTranscript').value = "";
      baselineText = "";
      
      if (micEnabled) {
         document.getElementById('status').innerText = "Sensei says listen...";
      } else {
         document.getElementById('status').innerText = "⌨️ Keyboard Mode";
      }

      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance("Spell " + currentWord);

      utterance.onend = () => {
         if (micEnabled) setTimeout(listenForSpelling, 500);
         document.getElementById('liveTranscript').focus();
      };
      window.speechSynthesis.speak(utterance);
    }
    
    function cleanLiveTranscript(text) {
      let cleanedText = text.toLowerCase().replace(/[.,?!]/g, '');

      cleanedText = cleanedText.replace(/\bletters?\b/g, ''); 
      cleanedText = cleanedText.replace(/\bdouble u\b/g, 'w');
      cleanedText = cleanedText.replace(/\bdouble you\b/g, 'w');

      const phoneticFixes = {
        'hi': 'i', 'eye': 'i', 'aye': 'i',
        'see': 'c', 'sea': 'c', 'si': 'c',
        'why': 'y', 'wide': 'y', 'wife': 'y', 'white': 'y',
        'you': 'u', 'ewe': 'u',
        'are': 'r', 'our': 'r', 'hour': 'r',
        'tea': 't', 'tee': 't',
        'bee': 'b', 'be': 'b',
        'oh': 'o', 'owe': 'o',
        'pea': 'p', 'pee': 'p',
        'cue': 'q', 'queue': 'q',
        'jay': 'j',
        'kay': 'k', 'okay': 'k',
        'ex': 'x', 'eggs': 'x',
        'em': 'm',
        'en': 'n', 'in': 'n', 'an': 'n',
        'el': 'l', 'ill': 'l',
        'es': 's', 'is': 's', 'yes': 's',
        'ar': 'r',
        'gee': 'g',
        'aitch': 'h',
        'eff': 'f',
        'dee': 'd',
        'vee': 'v',
        'zee': 'z', 'zed': 'z'
      };

      for (const [wrong, right] of Object.entries(phoneticFixes)) {
        let regex = new RegExp(`\\b${wrong}\\b`, 'g');
        cleanedText = cleanedText.replace(regex, right);
      }

      return cleanedText.toUpperCase().replace(/\s+/g, '').trim();
    }

    function listenForSpelling() {
      if (!micEnabled) return;
      isListening = true;
      document.getElementById('status').innerText = "🎤 Listening... (Tip: Say 'Letter Y')";
      
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) return alert("Please use Google Chrome.");

      recognition = new SpeechRecognition();
      recognition.lang = 'en-US';
      recognition.continuous = true; 
      recognition.interimResults = true; 

      recognition.onstart = function() {
        baselineText = document.getElementById('liveTranscript').value.trim();
      };

      recognition.onresult = function(event) {
        let currentSessionSpeech = "";

        for (let i = event.resultIndex; i < event.results.length; ++i) {
           currentSessionSpeech += event.results[i][0].transcript + " ";
        }
        
        let spokenTokens = currentSessionSpeech.toLowerCase().replace(/[.,?!]/g, '').trim().split(/\s+/);
        if (currentWord.length > 4 && spokenTokens.includes(currentWord.toLowerCase())) {
             document.getElementById('liveTranscript').value = baselineText; 
             document.getElementById('status').innerText = "🚫 SPELL IT OUT!";
             return; 
        }

        let cleanedSpeech = cleanLiveTranscript(currentSessionSpeech);

        if (cleanedSpeech) {
           let rawCombined = baselineText.replace(/\s+/g, '') + cleanedSpeech;
           let perfectlySpaced = rawCombined.split('').join(' ');
           document.getElementById('liveTranscript').value = perfectlySpaced;
        } else {
           document.getElementById('liveTranscript').value = baselineText;
        }
        
        document.getElementById('status').innerText = "🎤 Hearing: " + cleanLiveTranscript(currentSessionSpeech).split('').join(' ');
      };
      
      recognition.onend = function() {
        if (isListening && micEnabled) {
          try {
            recognition.start();
          } catch(err) {}
        }
      };

      try {
        recognition.start();
      } catch(err) {}
    }
    
    function triggerWinCelebration() {
      // 10 Second Epic Double-Cannon Confetti 
      var duration = 10000;
      var animationEnd = Date.now() + duration;
      var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 9999 };

      function randomInRange(min, max) {
        return Math.random() * (max - min) + min;
      }

      var interval = setInterval(function() {
        var timeLeft = animationEnd - Date.now();
        if (timeLeft <= 0) {
          return clearInterval(interval);
        }

        var particleCount = 50 * (timeLeft / duration);
        // Shoot from left edge
        confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
        // Shoot from right edge
        confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
      }, 250);
    }
    
    function displayVictoryScreen() {
      // Hide interactive elements
      document.getElementById('interactiveControls').style.display = 'none';
      document.getElementById('status').style.display = 'none';
      
      // Calculate top 5 struggled words
      const container = document.getElementById('struggleList');
      container.innerHTML = "";
      
      let missedWords = Object.entries(wordMistakeTracker)
          .filter(([word, count]) => count > 0)
          .sort((a, b) => b[1] - a[1]) // Sort by highest count
          .slice(0, 5); // Take top 5
          
      if (missedWords.length > 0) {
        missedWords.forEach(([word, count]) => {
          let div = document.createElement('div');
          div.className = 'struggle-item';
          div.innerHTML = `<span>${word.toUpperCase()}</span> <span class="miss-count">Missed ${count}x</span>`;
          container.appendChild(div);
        });
      } else {
        container.innerHTML = `<div style="text-align:center; padding: 10px; font-weight:bold; color:#27ae60;">✨ Flawless Victory! No words missed! ✨</div>`;
      }
      
      document.getElementById('victoryScreen').style.display = 'block';
    }

    function checkAnswer() {
      isListening = false;
      if (recognition) recognition.stop();
      clearTimeout(retryTimer);
      
      let rawText = document.getElementById('liveTranscript').value;
      let cleanedSpelling = rawText.replace(/[\s\.-]/g, '').toLowerCase();

      if (cleanedSpelling === currentWord.toLowerCase()) {
        score++;
        combo++; 
        updateNinjaTrack();
        
        document.getElementById('comboDisplay').style.display = 'inline';
        document.getElementById('comboCount').innerText = combo;
        
        if (score >= maxScore) {
          document.getElementById('status').innerText = "🏆 YOU REACHED THE DOJO! 🏆";
          document.getElementById('liveTranscript').value = "YOU WIN!";
          
          triggerWinCelebration(); 
          displayVictoryScreen();
          
          window.speechSynthesis.speak(new SpeechSynthesisUtterance("Congratulations! You have reached the Dojo and are a true Spelling Ninja!"));
          // Removed the auto-reload timeout so the screen stays up forever
        } else {
          const successPhrases = ["Great job", "Well done", "Awesome job", "Perfect strike", "You nailed it", "Ninja skills activated"];
          let phrase = successPhrases[Math.floor(Math.random() * successPhrases.length)];
          
          let verbalPhrase = phrase;
          let textPhrase = "✅ " + phrase + "!";
          
          if (combo > 1) {
             const adjectives = ["flying", "spinning", "shadow", "tornado", "lightning", "dragon", "stealth", "epic"];
             const moves = ["chop", "kick", "block", "flip", "dash", "roundhouse", "strike", "sweep"];
             
             let randomAdj = adjectives[Math.floor(Math.random() * adjectives.length)];
             let randomMove = moves[Math.floor(Math.random() * moves.length)];
             
             const comboPhrases = [
               ` That's a ${combo}-hit ${randomAdj} ${randomMove}!`,
               ` You unleashed a ${combo}-move ${randomAdj} combo!`,
               ` A perfect ${combo}-strike ${randomAdj} ${randomMove}!`,
               ` Feel the power of the ${combo}-hit ${randomAdj} ${randomMove}!`
             ];
             
             let chosenComboPhrase = comboPhrases[Math.floor(Math.random() * comboPhrases.length)];
             
             verbalPhrase += "." + chosenComboPhrase;
             textPhrase += chosenComboPhrase; 
          }
          
          document.getElementById('status').innerText = textPhrase;
          
          let successUtterance = new SpeechSynthesisUtterance(verbalPhrase);
          window.currentUtterance = successUtterance;
          
          successUtterance.onend = () => {
             setTimeout(nextWord, 500); 
          };
          
          window.speechSynthesis.speak(successUtterance);
        }
      } else {
        currentWordMistakes++;
        
        // Track global mistakes for the end-screen report
        wordMistakeTracker[currentWord] = (wordMistakeTracker[currentWord] || 0) + 1;
        
        combo = 0; 
        document.getElementById('comboDisplay').style.display = 'none';
        
        if (!wordPenaltyApplied) {
          score = Math.max(0, score - 1);
          wordPenaltyApplied = true;
          updateNinjaTrack();
        }
        
        const failPhrases = ["No! That's not right", "Better luck next time", "Sorry, but that is incorrect", "Try again, but be extra careful", "Not quite right"];
        let failPhrase = failPhrases[Math.floor(Math.random() * failPhrases.length)];
        
        document.getElementById('status').innerText = `❌ ${failPhrase}! You spelled: ${cleanedSpelling.split('').join(' ').toUpperCase()}`;
        
        let failUtterance = new SpeechSynthesisUtterance(failPhrase);
        window.currentUtterance = failUtterance;
        window.speechSynthesis.speak(failUtterance);
        
        if (currentWordMistakes >= 2) {
          document.getElementById('hintBtn').style.display = "inline-block";
          document.getElementById('tryAgainBtn').style.display = "inline-block";
        } else {
          retryTimer = setTimeout(speakAndListen, 3000);
        }
      }
    }
  </script>
</body>
</html>
