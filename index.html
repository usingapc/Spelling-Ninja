<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spelling Ninja</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; text-align: center; padding: 20px; background-color: #2c3e50; color: #333; }
    .card { background: white; max-width: 500px; margin: 0 auto; padding: 25px; border-radius: 12px; box-shadow: 0 8px 25px rgba(0,0,0,0.5); border-top: 5px solid #e74c3c; }
    h1 { color: #2c3e50; margin-top: 0; }
    .list-container { text-align: left; max-height: 200px; overflow-y: auto; border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px 15px; margin: 15px 0; background: #fafafa; }
    .checkbox-item { margin: 8px 0; font-size: 18px; display: flex; align-items: center; cursor: pointer; }
    .checkbox-item input { width: 20px; height: 20px; margin-right: 12px; }
    button { padding: 12px 24px; font-size: 18px; font-weight: bold; color: white; background-color: #34495e; border: none; border-radius: 8px; cursor: pointer; margin: 10px 5px; transition: 0.2s; }
    button:hover { background-color: #2c3e50; }
    button:disabled { background-color: #bdc3c7; cursor: not-allowed; }
    .btn-submit { background-color: #e74c3c; width: 100%; margin: 20px 0; font-size: 22px; padding: 15px; text-transform: uppercase; letter-spacing: 1px; display: block; }
    .btn-submit:hover { background-color: #c0392b; }
    .btn-secondary { background-color: #7f8c8d; }
    .btn-row { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .btn-row button { margin: 5px 0; flex: 1; min-width: 100px; font-size: 15px; padding: 10px; }
    #status { margin-top: 15px; font-size: 20px; font-weight: bold; color: #2980b9; }
    #liveTranscript { font-size: 24px; color: #e67e22; min-height: 40px; margin: 15px 0; padding: 10px; border: 2px dashed #bdc3c7; border-radius: 8px; background: #ecf0f1; letter-spacing: 3px; font-weight: bold;}
    #hintDisplay { font-size: 32px; color: #27ae60; font-weight: bold; letter-spacing: 6px; margin: 15px 0; display: none; }
    #gameArea { display: none; }
    
    /* Ninja Progress Track Styles */
    #scoreStats { font-size: 18px; font-weight: bold; color: #34495e; margin-bottom: 10px; background: #ecf0f1; padding: 10px; border-radius: 8px; border: 1px solid #bdc3c7;}
    #scoreStats span { color: #e74c3c; font-size: 20px; }
    #trackContainer { width: 100%; height: 12px; background: #bdc3c7; border-radius: 6px; position: relative; margin: 50px 0 40px 0; }
    #trackFill { position: absolute; left: 0; top: 0; height: 100%; width: 0%; background: #e74c3c; border-radius: 6px; transition: width 0.4s ease-out; }
    #ninjaSprite { position: absolute; left: 0%; top: -35px; transition: left 0.4s ease-out; z-index: 10; display: flex; flex-direction: column; align-items: center; }
    .ninja-icon { font-size: 35px; line-height: 1; }
    #ninjaScoreBadge { font-size: 14px; font-weight: bold; background: white; color: #e74c3c; border-radius: 50%; width: 22px; height: 22px; line-height: 22px; text-align: center; border: 2px solid #e74c3c; margin-top: 2px; }
    #dojoSprite { position: absolute; right: -5px; top: -25px; font-size: 35px; }
  </style>
</head>
<body>

  <div class="card" id="appCard">
    <h1>🥷 Spelling Ninja</h1>
    
    <div id="selectionArea">
      <div id="listCheckboxes" class="list-container">Loading word scrolls...</div>
      <button id="startBtn" onclick="startPractice()" disabled>Enter the Dojo</button>
    </div>

    <div id="gameArea">
      <div id="scoreStats">
        Points Needed to Win: <span id="pointsRemaining">0</span> <br>
        <small style="color: #7f8c8d; font-size: 14px;">(Total Required: <span id="pointsTotal">0</span>)</small>
      </div>

      <div id="trackContainer">
        <div id="trackFill"></div>
        <div id="ninjaSprite">
          <div class="ninja-icon">🥷</div>
          <div id="ninjaScoreBadge">0</div>
        </div>
        <div id="dojoSprite">🏯</div>
      </div>

      <div id="status">Sensei says listen...</div>
      <div id="liveTranscript">...</div>
      <div id="hintDisplay"></div>
      
      <button onclick="checkAnswer()" class="btn-submit" id="submitBtn">Strike!</button>
      
      <div class="btn-row">
        <button id="hintBtn" onclick="showHint()" class="btn-secondary" style="background-color: #8e44ad; display: none;">💡 Hint</button>
        <button id="tryAgainBtn" onclick="tryAgainManual()" class="btn-secondary" style="background-color: #3498db; display: none;">🔄 Try Again</button>
        <button onclick="repeatWord()" class="btn-secondary">🔊 Hear Again</button>
        <button onclick="useInSentence()" class="btn-secondary" style="background-color: #f39c12;">📖 Sentence</button>
        <button onclick="clearCurrentText()" class="btn-secondary" style="background-color: #95a5a6;">✖ Clear Text</button>
      </div>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbw-2IckMLtFYfVC7cGHZAei98DESEcJLXVt5RquD26oJRyYcsnpFaEbFeWZBPLQGBH5dw/exec"; 
    
    let allLists = {};
    let activeWords = [];
    let remainingDeck = [];
    let currentWord = "";
    
    let recognition;
    let globalTranscript = ""; // Locked-in permanent memory for letters
    
    let retryTimer;
    let isListening = false;
    
    let score = 0;
    let maxScore = 1;
    let currentWordMistakes = 0;
    let wordPenaltyApplied = false;
    let hintPenaltyApplied = false;

    fetch(API_URL)
      .then(response => response.json())
      .then(data => {
        allLists = data;
        renderListOptions();
      })
      .catch(error => {
        console.error("Error fetching data:", error);
        document.getElementById('listCheckboxes').innerText = "Failed to load ninja scrolls. Check your API URL.";
      });

    function renderListOptions() {
      const container = document.getElementById('listCheckboxes');
      container.innerHTML = "";
      const titles = Object.keys(allLists);
      
      if (titles.length === 0) {
        container.innerText = "No word lists found.";
        return;
      }

      titles.forEach((title, index) => {
        const div = document.createElement('div');
        div.className = 'checkbox-item';
        div.innerHTML = `<input type="checkbox" id="list_${index}" value="${title}" onchange="checkSelection()"><label for="list_${index}">${title}</label>`;
        container.appendChild(div);
      });
      document.getElementById('startBtn').disabled = false;
    }

    function checkSelection() {
      const checked = document.querySelectorAll('#listCheckboxes input[type="checkbox"]:checked');
      document.getElementById('startBtn').disabled = checked.length === 0;
    }
    
    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
    }

    function startPractice() {
      const checkedBoxes = document.querySelectorAll('#listCheckboxes input[type="checkbox"]:checked');
      activeWords = [];
      checkedBoxes.forEach(cb => {
        if (allLists[cb.value]) activeWords = activeWords.concat(allLists[cb.value]);
      });

      if (activeWords.length === 0) return alert("Select at least one training scroll.");

      remainingDeck = []; 
      score = 0;
      maxScore = activeWords.length * 2;
      document.getElementById('pointsTotal').innerText = maxScore;
      updateNinjaTrack();

      document.getElementById('selectionArea').style.display = 'none';
      document.getElementById('gameArea').style.display = 'block';
      nextWord();
    }
    
    function updateNinjaTrack() {
      let progress = (score / maxScore) * 90;
      document.getElementById('ninjaSprite').style.left = progress + "%";
      document.getElementById('trackFill').style.width = progress + "%";
      
      document.getElementById('ninjaScoreBadge').innerText = score;
      document.getElementById('pointsRemaining').innerText = Math.max(0, maxScore - score);
    }

    function nextWord() {
      currentWordMistakes = 0;
      wordPenaltyApplied = false;
      hintPenaltyApplied = false;
      document.getElementById('hintBtn').style.display = "none";
      document.getElementById('tryAgainBtn').style.display = "none";
      document.getElementById('hintDisplay').style.display = "none";
      document.getElementById('submitBtn').style.display = "block"; 

      if (remainingDeck.length === 0) {
        remainingDeck = [...activeWords];
        shuffleArray(remainingDeck);
        
        if (remainingDeck.length > 1 && remainingDeck[0] === currentWord) {
          let temp = remainingDeck[0];
          remainingDeck[0] = remainingDeck[1];
          remainingDeck[1] = temp;
        }
      }

      currentWord = remainingDeck.shift();
      speakAndListen();
    }

    function repeatWord() {
      speakAndListen();
    }

    function showHint() {
      if (!hintPenaltyApplied) {
        score = Math.max(0, score - 1);
        hintPenaltyApplied = true;
        updateNinjaTrack();
      }
      document.getElementById('hintDisplay').innerText = currentWord.toUpperCase();
      document.getElementById('hintDisplay').style.display = "block";
      document.getElementById('submitBtn').style.display = "none"; 
    }

    function tryAgainManual() {
      document.getElementById('hintDisplay').style.display = "none";
      document.getElementById('submitBtn').style.display = "block"; 
      speakAndListen();
    }
    
    function clearCurrentText() {
      globalTranscript = ""; // Wipe locked-in memory
      document.getElementById('liveTranscript').innerText = "...";
    }

    function useInSentence() {
      isListening = false;
      if (recognition) recognition.stop();
      clearTimeout(retryTimer);
      document.getElementById('hintDisplay').style.display = "none";
      document.getElementById('status').innerText = "Sensei is consulting the AI scrolls...";
      window.speechSynthesis.cancel();

      fetch(API_URL + "?word=" + encodeURIComponent(currentWord))
        .then(response => response.text())
        .then(sentence => {
          document.getElementById('status').innerText = "Sensei says listen...";
          let sentenceText = `${currentWord}. ${sentence} ${currentWord}.`;
          const utterance = new SpeechSynthesisUtterance(sentenceText);
          utterance.onend = () => setTimeout(listenForSpelling, 500);
          window.speechSynthesis.speak(utterance);
        })
        .catch(error => {
          document.getElementById('status').innerText = "Sensei says listen...";
          const utterance = new SpeechSynthesisUtterance(`Spell ${currentWord}.`);
          utterance.onend = () => setTimeout(listenForSpelling, 500);
          window.speechSynthesis.speak(utterance);
        });
    }

    function speakAndListen() {
      isListening = false;
      if (recognition) recognition.stop();
      clearTimeout(retryTimer);
      globalTranscript = ""; 
      
      document.getElementById('hintDisplay').style.display = "none"; 
      document.getElementById('liveTranscript').innerText = "...";
      document.getElementById('status').innerText = "Sensei says listen...";

      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance("Spell " + currentWord);

      utterance.onend = () => setTimeout(listenForSpelling, 500);
      window.speechSynthesis.speak(utterance);
    }
    
    function cleanLiveTranscript(text) {
      let cleanedText = text.toLowerCase().replace(/[.,?!]/g, '');

      // Universally strip the words "letter" or "letters" anywhere they appear
      cleanedText = cleanedText.replace(/\bletters?\b/g, ''); 

      cleanedText = cleanedText.replace(/\bdouble u\b/g, 'w');
      cleanedText = cleanedText.replace(/\bdouble you\b/g, 'w');

      const phoneticFixes = {
        'hi': 'i', 'eye': 'i', 'aye': 'i',
        'see': 'c', 'sea': 'c', 'si': 'c',
        'why': 'y', 'wide': 'y', 'wife': 'y', 'white': 'y',
        'you': 'u', 'ewe': 'u',
        'are': 'r', 'our': 'r', 'hour': 'r',
        'tea': 't', 'tee': 't',
        'bee': 'b', 'be': 'b',
        'oh': 'o', 'owe': 'o',
        'pea': 'p', 'pee': 'p',
        'cue': 'q', 'queue': 'q',
        'jay': 'j',
        'kay': 'k', 'okay': 'k',
        'ex': 'x', 'eggs': 'x',
        'em': 'm',
        'en': 'n', 'in': 'n', 'an': 'n',
        'el': 'l', 'ill': 'l',
        'es': 's', 'is': 's', 'yes': 's',
        'ar': 'r',
        'gee': 'g',
        'aitch': 'h',
        'eff': 'f',
        'dee': 'd',
        'vee': 'v',
        'zee': 'z', 'zed': 'z'
      };

      for (const [wrong, right] of Object.entries(phoneticFixes)) {
        let regex = new RegExp(`\\b${wrong}\\b`, 'g');
        cleanedText = cleanedText.replace(regex, right);
      }

      // Format neatly with consistent spaces
      return cleanedText.toUpperCase().replace(/\s+/g, ' ').trim();
    }

    function listenForSpelling() {
      isListening = true;
      document.getElementById('status').innerText = "🎤 Sensei is listening... (Tip: Say 'Letter Y' if stuck)";
      
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) return alert("Please use Google Chrome.");

      recognition = new SpeechRecognition();
      recognition.lang = 'en-US';
      recognition.continuous = true; 
      recognition.interimResults = true; 

      recognition.onresult = function(event) {
        let interimTranscript = "";

        // Iterate through new results. If final, lock it into globalTranscript forever.
        for (let i = event.resultIndex; i < event.results.length; ++i) {
          if (event.results[i].isFinal) {
            globalTranscript += event.results[i][0].transcript + " ";
          } else {
            interimTranscript += event.results[i][0].transcript + " ";
          }
        }
        
        // Combine permanent memory with any live partial text
        let rawText = globalTranscript + interimTranscript;
        
        // LIVE CHEAT PREVENTION
        let spokenTokens = rawText.toLowerCase().replace(/[.,?!]/g, '').trim().split(/\s+/);
        if (currentWord.length > 4 && spokenTokens.includes(currentWord.toLowerCase())) {
           document.getElementById('liveTranscript').innerText = "🚫 SPELL IT OUT!";
           globalTranscript = ""; // Punish cheat by wiping memory
        } else {
           document.getElementById('liveTranscript').innerText = cleanLiveTranscript(rawText);
        }
      };
      
      // Auto-restart without destroying locked-in memory
      recognition.onend = function() {
        if (isListening) {
          try {
            recognition.start();
          } catch(err) {}
        }
      };

      try {
        recognition.start();
      } catch(err) {}
    }

    function checkAnswer() {
      isListening = false;
      if (recognition) recognition.stop();
      clearTimeout(retryTimer);
      
      let rawText = document.getElementById('liveTranscript').innerText.toLowerCase();
      
      if (currentWord.length > 4 && rawText.trim() === currentWord.toLowerCase()) {
        document.getElementById('status').innerText = "⚠️ Sensei says: Please spell it letter by letter!";
        window.speechSynthesis.speak(new SpeechSynthesisUtterance("Please spell the word letter by letter."));
        clearCurrentText();
        setTimeout(listenForSpelling, 2500);
        return;
      }

      let cleanedSpelling = rawText.replace(/[\s\.-]/g, '');

      if (cleanedSpelling === currentWord.toLowerCase()) {
        score++;
        updateNinjaTrack();
        
        if (score >= maxScore) {
          document.getElementById('status').innerText = "🏆 You reached the Dojo! 🏆";
          document.getElementById('liveTranscript').innerText = "YOU WIN!";
          window.speechSynthesis.speak(new SpeechSynthesisUtterance("Congratulations! You won!"));
          setTimeout(function() { location.reload(); }, 4000); 
        } else {
          document.getElementById('status').innerText = "✅ Perfect Strike!";
          window.speechSynthesis.speak(new SpeechSynthesisUtterance("Perfect!"));
          setTimeout(nextWord, 1500);
        }
      } else {
        currentWordMistakes++;
        
        if (!wordPenaltyApplied) {
          score = Math.max(0, score - 1);
          wordPenaltyApplied = true;
          updateNinjaTrack();
        }
        
        document.getElementById('status').innerText = `❌ Missed! You spelled: ${cleanedSpelling}`;
        window.speechSynthesis.speak(new SpeechSynthesisUtterance("Try again."));
        
        if (currentWordMistakes >= 2) {
          document.getElementById('hintBtn').style.display = "inline-block";
          document.getElementById('tryAgainBtn').style.display = "inline-block";
        } else {
          retryTimer = setTimeout(speakAndListen, 2500);
        }
      }
    }
  </script>
</body>
</html>
